name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123
      BASE_URL: http://127.0.0.1:3000

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          node src/server.js > api.log 2>&1 &

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat api.log
          exit 1

      - name: Executar testes
        run: npm test -- --reporter mochawesome

      - name: Publicar relatório dos testes gestao de alunos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-gestao-de-alunos
          path: mochawesome-report/